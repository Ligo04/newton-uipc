# Warp kernels use operators and indexed writes that are implemented by Warp's
# code generator but are not represented in the distributed Python stubs.
# Keep ty useful for the rest of the project while avoiding false positives in
# example code that directly exercises the Warp DSL.
[[overrides]]
include = ["newton/examples/**"]

[overrides.analysis]
replace-imports-with-any = ["warp.**"]
